<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>航廈教育訓練統計儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #28a745;
      --accent-color: #d39e00;
      --bg-color: #f4f7f6;
      --table-header: #f8f9fa;
      --table-border: #dee2e6;
    }

    body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); padding: 20px; color: #333; margin: 0; }
    h1 { text-align: center; color: var(--primary-color); font-weight: 700; margin-bottom: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
    
    .tab-container { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; justify-content: center; }
    .tab-btn { padding: 12px 30px; cursor: pointer; border: 2px solid var(--primary-color); background: #fff; color: var(--primary-color); border-radius: 30px; font-size: 16px; font-weight: bold; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .tab-btn:hover { background: #e6f0fa; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .tab-btn.active { background: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(0,86,179,0.3); }
    
    .year-section { display: none; animation: fadeIn 0.5s ease-in-out; }
    .year-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 35px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card-total { border-top: 6px solid var(--secondary-color); }
    .card-terminal { border-top: 6px solid var(--primary-color); }
    .card-course { border-top: 6px solid #ffc107; }
    .card-chart { border-top: 6px solid #17a2b8; }
    
    h2 { color: var(--primary-color); border-left: 5px solid var(--primary-color); padding-left: 12px; margin-top: 0; font-size: 1.4em; }
    .title-total { color: var(--secondary-color); border-color: var(--secondary-color); }
    .title-course { color: var(--accent-color); border-color: #ffc107; }
    .title-chart { color: #17a2b8; border-color: #17a2b8; }

    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; box-shadow: inset 0 0 5px rgba(0,0,0,0.02); }

    table { width: 100%; border-collapse: collapse; margin-top: 5px; background: #fff; font-size: 15px; white-space: nowrap; }
    th, td { border: 1px solid var(--table-border); padding: 10px 12px; text-align: center; vertical-align: middle; }
    th { background-color: var(--table-header); color: #495057; font-weight: 600; }
    .total-col { background-color: #eef2f5; font-weight: bold; color: var(--primary-color); }
    .highlight-num { color: #d9534f; font-weight: bold; font-size: 1.1em; } 

    .course-table th { background-color: #fff8e1; color: #856404; }
    .course-table tr.clickable { cursor: pointer; transition: background 0.2s; }
    .course-table tr.clickable:hover { background-color: #fff3cd; }
    .rank-num { font-weight: bold; color: #6c757d; font-size: 1.1em; }
    .click-hint { font-size: 0.85em; color: #856404; font-weight: normal; background: #fff3cd; padding: 6px 10px; border-radius: 6px; display: inline-block; margin-top: 8px; border: 1px dashed #ffeeba; }

    .loading { text-align: center; padding: 50px; font-size: 1.3em; color: var(--primary-color); display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .loader-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 🌟 Modal 修復與感應區放大 🌟 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
    .modal-content { background: #f8f9fa; width: 95%; max-width: 1100px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; position: relative; z-index: 10000; }
    .modal-header { background: var(--primary-color); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; }
    
    /* 放大 X 按鈕的點擊範圍，確保手機好點 */
    .close-btn { 
      background: none; border: none; color: white; font-size: 32px; 
      cursor: pointer; line-height: 1; padding: 10px; margin: -10px; 
      touch-action: manipulation;
    }
    .modal-body { padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    
    .modal-card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid var(--primary-color); }
    .modal-card h4 { margin: 0 0 15px 0; color: var(--primary-color); font-size: 1.1em; }
    .modal-table th { background: #eef2f5; font-size: 14px; padding: 8px; }
    .modal-table td { font-size: 14px; padding: 8px; }
    .modal-empty { text-align: center; color: #6c757d; padding: 20px; }
    .modal-dates { font-size: 0.75em; color: #555; background-color: #f1f3f5; border-radius: 4px; padding: 3px 6px; margin-top: 6px; display: inline-block; line-height: 1.4; border: 1px solid #e9ecef; white-space: normal; }
    
    .chart-container { position: relative; width: 100%; height: 350px; margin-top: 20px; }

    @media (max-width: 768px) {
      body { padding: 8px; }
      h1 { font-size: 1.3em; margin-bottom: 15px; line-height: 1.4; }
      .tab-container { gap: 8px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; }
      .tab-btn { padding: 10px 5px; font-size: 13px; width: 100%; box-sizing: border-box; }
      .card { padding: 12px; margin-bottom: 20px; border-radius: 8px; }
      h2 { font-size: 1.1em; padding-left: 8px; margin-bottom: 12px; }
      .chart-container { height: 260px; margin-top: 10px; }
      .course-table td:nth-child(2) { white-space: normal; min-width: 150px; line-height: 1.4; text-align: left; }
      table { font-size: 13px; }
      th, td { padding: 8px 6px; }
      .highlight-num { font-size: 1em; }
      .click-hint { display: block; margin-left: 0; font-size: 0.8em; margin-top: 8px; text-align: left; }
      .modal-header h3 { font-size: 15px; }
      .modal-body { padding: 12px 8px; }
      .modal-card { padding: 10px; border-left-width: 3px; }
      .modal-table { font-size: 12px; }
      .modal-table th, .modal-table td { padding: 6px 4px; }
    }
  </style>
</head>
<body>
  <h1>✈️ 桃園機場職安教育訓練儀表板</h1>
  <div id="app">
    <div class="loading" id="loading">
      <div class="loader-spinner"></div>
      <div>正在連線至資料庫讀取最新數據...</div>
    </div>
    <div id="content"></div>
  </div>

  <!-- 🌟 移除了原本的 onclick，改用 JS 監聽確保手機可用 🌟 -->
  <div class="modal-overlay" id="courseModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalCourseTitle">課程名稱</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // ⚠️ 記得將下方換成您最新發佈的 GAS 網頁應用程式網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXg47GxjMju-NFoGnOp6CO5AyFZZ6PrqKMH2qBI3CncaFFoTISIPT3TBiQ-2h_CFIVJw/exec';

    // ==========================================
    // 🌟 修復 Modal 關閉機制 🌟
    // ==========================================
    const courseModal = document.getElementById('courseModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 點擊 X 按鈕關閉
    closeModalBtn.addEventListener('click', function(e) {
      e.preventDefault();
      courseModal.classList.remove('active');
    });

    // 點擊背景灰色區域關閉 (限定只能點擊 overlay 本身)
    courseModal.addEventListener('click', function(e) {
      if (e.target === courseModal) {
        courseModal.classList.remove('active');
      }
    });

    function normalizeCourseName(rawName) {
      if (!rawName) return "其他作業 - 未分類";
      let n = rawName.toString().trim().replace(/(教育訓練|宣導|教學|注意事項|規範|員工|測驗|敎育訓練|作業流程|處理流程|通報流程)$/g, "").replace(/敎育訓練/g, "").replace(/。/g, "").toLowerCase();

      if (n.includes("化學品") || n.includes("稀釋") || n.includes("立剋滅") || n.includes("清潔劑")) return "共同作業 - 危害性化學品分裝、稀釋作業";
      if (n.includes("防護") || n.includes("隔離衣") || n.includes("口罩") || n.includes("手套")) return "共同作業 - 個人防護穿脫作業";
      if (n.includes("火災") || n.includes("火警") || n.includes("滅火器") || n.includes("行動電源起火")) return "共同作業 - 火災緊急應變";
      if (n.includes("地震")) return "共同作業 - 地震緊急應變";
      if (n.includes("豪大雨") || n.includes("颱風")) return "共同作業 - 豪大雨緊急應變";
      if (n.includes("洗地車") || n.includes("駕駛式洗地")) return "機械設備使用 - 駕駛式洗地車";
      if (n.includes("洗地機") || n.includes("打磨機") || n.includes("研磨機")) return "機械設備使用 - 打蠟機/石材晶化機";
      if (n.includes("道路清掃車") || n.includes("掃街車")) return "機械設備使用 - 道路清掃車";
      if (n.includes("地毯") && (n.includes("駕駛") || n.includes("清洗機"))) return "機械設備使用 - 駕駛式/一般地毯清洗機";
      if (n.includes("吸塵器") && n.includes("背負式")) return "機械設備使用 - 背負式吸塵器";
      if (n.includes("吸塵器") && n.includes("乾濕兩用")) return "機械設備使用 - 乾濕兩用吸塵器";
      if (n.includes("吸塵器")) return "機械設備使用 - 乾式吸塵器";
      if (n.includes("打蠟機") || n.includes("高速打蠟機")) return "機械設備使用 - 打蠟機";
      if (n.includes("噴霧機") && n.includes("背負式")) return "機械設備使用 - 背負式噴霧機";
      if (n.includes("噴霧機") || n.includes("電動噴霧機") || n.includes("手壓式噴霧器")) return "機械設備使用 - 各式噴霧器(手壓/電動)";
      if (n.includes("次氯酸水") || n.includes("電解水")) return "機械設備使用 - 次氯酸水機";
      if (n.includes("高空工作車") || n.includes("剪刀車")) return "機械設備使用 - 高空工作車操作";
      if (n.includes("吊籠") || n.includes("洗窗")) return "機械設備使用 - 吊籠操作";
      if (n.includes("升降平台") || n.includes("昇降平台")) return "機械設備使用 - 昇降平台操作";
      if (n.includes("機器人") || n.includes("智能除菌")) return "機械設備使用 - 智能除菌/紫外線機器人";
      if (n.includes("冷光儀") || n.includes("atp") || n.includes("測光儀")) return "機械設備使用 - ATP檢測儀/測光儀";
      if (n.includes("工作推車") || n.includes("潔具車")) return "施設備使用 - 工作推車使用";
      if (n.includes("手推車") || n.includes("垃圾推車") || n.includes("大垃圾推車")) return "施設備使用 - 手推車/垃圾推車使用";
      if (n.includes("a字梯") || n.includes("梯子")) return "施設備使用 - A字梯使用";
      if (n.includes("公務車") || n.includes("巡檢車") || n.includes("駕駛")) return "駕駛作業 - 駕駛公務車/巡檢車";
      if (n.includes("廁所") || n.includes("洗手間") || n.includes("馬桶") || n.includes("小便斗") || n.includes("kpi")) return "一般清潔作業 - 廁所清潔作業 (含KPI 6+1/耗材)";
      if (n.includes("地面清洗") || n.includes("洗地")) return "一般清潔作業 - 地面清洗作業";
      if (n.includes("戶外") || n.includes("人行道") || n.includes("停車場") || n.includes("騎樓")) return "一般清潔作業 - 戶外清潔作業";
      if (n.includes("行李處理場") || n.includes("機坪")) return "一般清潔作業 - 行李處理場、機坪作業";
      if (n.includes("垃圾") || n.includes("資源回收") || n.includes("廚餘")) return "一般清潔作業 - 垃圾收集暨清潔作業";
      if (n.includes("候機室")) return "一般清潔作業 - 候機室設施設備清潔";
      if (n.includes("哺乳室")) return "一般清潔作業 - 哺乳室設施設備清潔";
      if (n.includes("茶水間") || n.includes("飲水機")) return "一般清潔作業 - 茶水間/飲水機清潔作業";
      if (n.includes("大廳") || n.includes("長廊") || n.includes("公區清消")) return "一般清潔作業 - 大廳/長廊清潔作業";
      if (n.includes("環境除臭") || n.includes("消毒") || n.includes("清消") || n.includes("接觸點")) return "一般清潔作業 - 環境除臭及消毒作業";
      if (n.includes("塑膠") || n.includes("大理石") || n.includes("花崗石") || n.includes("晶化")) return "一般清潔作業 - 洗地、打蠟及晶化作業";
      if (n.includes("不鏽鋼") || n.includes("不銹鋼") || n.includes("除鏽")) return "一般清潔作業 - 不鏽鋼清潔作業";
      if (n.includes("煙灰桶") || n.includes("菸灰桶")) return "一般清潔作業 - 煙灰桶清潔作業";
      if (n.includes("樓梯") || n.includes("電扶梯周邊") || n.includes("扶手")) return "一般清潔作業 - 樓梯清潔作業";
      if (n.includes("除塵") || n.includes("蜘蛛網") || n.includes("窗戶走廊") || n.includes("天花板牆柱")) return "一般清潔作業 - 除塵清潔作業";
      if (n.includes("玻璃") || n.includes("鏡面")) return "一般清潔作業 - 玻璃與鏡面清潔作業";
      if (n.includes("嘔吐物") || n.includes("液體灑落")) return "一般清潔作業 - 嘔吐物處理作業";
      if (n.includes("飲料打翻") || n.includes("飲料傾倒")) return "一般清潔作業 - 飲料傾倒清潔作業";
      if (n.includes("漏水") || n.includes("滴水") || n.includes("爆管")) return "一般清潔作業 - 天花板漏水處理作業";
      if (n.includes("通報") || n.includes("異常") || n.includes("損壞") || n.includes("31999") || n.includes("occ")) return "一般清潔作業 - 設施設備損壞/異常通報作業";
      if (n.includes("跌倒") || n.includes("滑倒") || n.includes("暈倒")) return "一般清潔作業 - 旅客跌倒回報處置作業";
      if (n.includes("遺失物") || n.includes("無主行李")) return "一般清潔作業 - 拾獲遺失物處理作業";
      if (n.includes("顏色區分") || n.includes("分色")) return "一般清潔作業 - 抹布及平板布顏色區分";
      if (n.includes("抹布") || n.includes("八折法")) return "一般清潔作業 - 抹布八折法";
      if (n.includes("雨傘套")) return "一般清潔作業 - 雨傘套組裝作業";
      if (n.includes("緊急按鈕解除") || n.includes("復歸") || n.includes("緊急求救鈴") || n.includes("電扶梯") || n.includes("電走道")) return "一般清潔作業 - 緊急按鈕解除作業";
      if (n.includes("禮儀") || n.includes("應對") || n.includes("旅客諮詢") || n.includes("中英文")) return "其他作業 - 服務禮儀與旅客應對";
      if (n.includes("可疑") || n.includes("危安") || n.includes("反恐")) return "其他作業 - 發現可疑人事物處置";
      if (n.includes("管制證") || n.includes("通行證") || n.includes("門禁")) return "其他作業 - 管制區通行與門禁規範";
      if (n.includes("墜落") || n.includes("滾落")) return "其他作業 - 墜落/滾落危害告知";
      if (n.includes("cpr") || n.includes("aed") || n.includes("急救")) return "其他作業 - CPR與AED急救訓練";
      return "其他作業 - " + rawName.toString().trim();
    }

    function formatCellWithDates(count, datesArray) {
      if (count === 0) return "0";
      const uniqueDates = [...new Set(datesArray)].sort();
      const dateHtml = uniqueDates.length > 0 ? `<br><div class="modal-dates">${uniqueDates.join(', ')}</div>` : '';
      return `<span class="highlight-num">${count}</span>${dateHtml}`;
    }

    function showCourseDetails(courseName, detailsArray) {
      document.getElementById('modalCourseTitle').textContent = `📄 ${courseName}`;
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';
      
      if (!detailsArray || detailsArray.length === 0) {
        modalBody.innerHTML = '<div class="modal-empty">暫無上課紀錄</div>';
        courseModal.classList.add('active');
        return;
      }

      const analyzedData = {};
      detailsArray.forEach(detail => {
        const terminal = detail.terminal;
        const shift = detail.shift;
        const people = parseInt(detail.people) || 0;
        let monthStr = "未知月";
        if (detail.date && detail.date.includes('/')) monthStr = `${detail.date.split('/')[0]}月`;

        if (!analyzedData[terminal]) analyzedData[terminal] = {};
        if (!analyzedData[terminal][monthStr]) {
          analyzedData[terminal][monthStr] = { '早班': {s:0, p:0, dates:[]}, '中班': {s:0, p:0, dates:[]}, '夜班': {s:0, p:0, dates:[]} };
        }
        if (analyzedData[terminal][monthStr][shift]) {
          analyzedData[terminal][monthStr][shift].s += 1;
          analyzedData[terminal][monthStr][shift].p += people;
          if (detail.date) analyzedData[terminal][monthStr][shift].dates.push(detail.date);
        }
      });

      const terminals = Object.keys(analyzedData).sort();
      terminals.forEach(terminal => {
        const card = document.createElement('div');
        card.className = 'modal-card';
        card.innerHTML = `<h4>📍 ${terminal}</h4>`;
        
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-responsive';
        
        const table = document.createElement('table');
        table.className = 'modal-table';
        table.innerHTML = `
          <thead>
            <tr><th rowspan="2" width="10%">月份</th><th colspan="2">早班</th><th colspan="2">中班</th><th colspan="2">夜班</th><th colspan="2" class="total-col">合計</th></tr>
            <tr><th width="12%">場次(日期)</th><th>人數</th><th width="12%">場次(日期)</th><th>人數</th><th width="12%">場次(日期)</th><th>人數</th><th class="total-col">場次</th><th class="total-col">人數</th></tr>
          </thead>
          <tbody></tbody>
        `;
        
        const tbody = table.querySelector('tbody');
        const monthsData = analyzedData[terminal];
        const sortedMonths = Object.keys(monthsData).sort();
        let tSess = 0, tPeop = 0;

        sortedMonths.forEach(month => {
          const mData = monthsData[month];
          const msSess = mData['早班'].s + mData['中班'].s + mData['夜班'].s;
          const msPeop = mData['早班'].p + mData['中班'].p + mData['夜班'].p;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${month}</td>
            <td>${formatCellWithDates(mData['早班'].s, mData['早班'].dates)}</td>
            <td>${mData['早班'].p > 0 ? `<span class="highlight-num">${mData['早班'].p}</span>` : '0'}</td>
            <td>${formatCellWithDates(mData['中班'].s, mData['中班'].dates)}</td>
            <td>${mData['中班'].p > 0 ? `<span class="highlight-num">${mData['中班'].p}</span>` : '0'}</td>
            <td>${formatCellWithDates(mData['夜班'].s, mData['夜班'].dates)}</td>
            <td>${mData['夜班'].p > 0 ? `<span class="highlight-num">${mData['夜班'].p}</span>` : '0'}</td>
            <td class="total-col">${msSess}</td><td class="total-col">${msPeop}</td>
          `;
          tbody.appendChild(tr);
          tSess += msSess;
          tPeop += msPeop;
        });

        const footer = document.createElement('tr');
        footer.innerHTML = `<td style="font-weight:bold; background:#eef2f5;">小計</td><td colspan="6" style="background:#eef2f5;"></td><td class="total-col">${tSess}</td><td class="total-col">${tPeop}</td>`;
        tbody.appendChild(footer);
        
        tableWrapper.appendChild(table);
        card.appendChild(tableWrapper);
        modalBody.appendChild(card);
      });
      courseModal.classList.add('active');
    }

    function createStatsTable(monthsData, title, titleClass = "", cardClass = "") {
      const card = document.createElement('div');
      card.className = `card ${cardClass}`;
      card.innerHTML = `<h2 class="${titleClass}">${title}</h2>`;
      
      const tableWrapper = document.createElement('div');
      tableWrapper.className = 'table-responsive';
      
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr><th rowspan="2">月份</th><th colspan="2">早班</th><th colspan="2">中班</th><th colspan="2">夜班</th><th colspan="2" class="total-col">月總計</th></tr>
          <tr><th>場次</th><th>人數</th><th>場次</th><th>人數</th><th>場次</th><th>人數</th><th class="total-col">總場次</th><th class="total-col">總人數</th></tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');
      const sortedMonths = Object.keys(monthsData).sort();
      let yearTotalSessions = 0, yearTotalPeople = 0;
      sortedMonths.forEach(month => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${month}</td>`;
        let monthSessions = 0, monthPeople = 0;
        ['早班', '中班', '夜班'].forEach(shift => {
          const stats = monthsData[month][shift] || { sessions: 0, people: 0 };
          tr.innerHTML += `<td>${stats.sessions > 0 ? `<span class="highlight-num">${stats.sessions}</span>` : "0"}</td>
                           <td>${stats.people > 0 ? `<span class="highlight-num">${stats.people}</span>` : "0"}</td>`;
          monthSessions += stats.sessions;
          monthPeople += stats.people;
        });
        tr.innerHTML += `<td class="total-col">${monthSessions}</td><td class="total-col">${monthPeople}</td>`;
        tbody.appendChild(tr);
        yearTotalSessions += monthSessions;
        yearTotalPeople += monthPeople;
      });
      const footerTr = document.createElement('tr');
      footerTr.innerHTML = `<td style="font-weight: bold; background: #eef2f5;">年度累計</td><td colspan="6" style="background: #eef2f5;"></td><td class="total-col" style="font-size:1.1em;">${yearTotalSessions}</td><td class="total-col" style="font-size:1.1em;">${yearTotalPeople}</td>`;
      tbody.appendChild(footerTr);
      
      tableWrapper.appendChild(table);
      card.appendChild(tableWrapper);
      return card;
    }

    const commonChartOptions = {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { 
        legend: { position: 'top' },
        tooltip: { position: 'nearest' } // 防溢出
      },
      scales: {
        ySessions: { type: 'linear', display: true, position: 'left', title: { display: true, text: '場次' }, suggestedMin: 0 },
        yPeople: { type: 'linear', display: true, position: 'right', title: { display: true, text: '人數' }, grid: { drawOnChartArea: false }, suggestedMin: 0 }
      }
    };

    fetch(GAS_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        const contentDiv = document.getElementById('content');
        
        const sortedYears = Object.keys(data).sort();
        const yearlyLabels = [];
        const yearlySessions = [];
        const yearlyPeople = [];

        sortedYears.forEach(year => {
          let yS = 0, yP = 0;
          const terminals = data[year].stats;
          Object.values(terminals).forEach(months => {
            Object.values(months).forEach(shiftData => {
              ['早班', '中班', '夜班'].forEach(shift => {
                yS += (shiftData[shift]?.sessions || 0);
                yP += (shiftData[shift]?.people || 0);
              });
            });
          });
          yearlyLabels.push(`${year}年`);
          yearlySessions.push(yS);
          yearlyPeople.push(yP);
        });

        const globalChartCard = document.createElement('div');
        globalChartCard.className = 'card card-chart';
        globalChartCard.innerHTML = `
          <h2 class="title-chart">📈 歷年教育訓練總體趨勢 (年曲線圖)</h2>
          <div class="chart-container"><canvas id="yearlyChart"></canvas></div>
        `;
        contentDiv.appendChild(globalChartCard);

        new Chart(document.getElementById('yearlyChart').getContext('2d'), {
          type: 'line',
          data: {
            labels: yearlyLabels,
            datasets: [
              { label: '總人數', data: yearlyPeople, borderColor: '#d9534f', backgroundColor: 'rgba(217,83,79,0.1)', yAxisID: 'yPeople', tension: 0.3, fill: true },
              { label: '總場次', data: yearlySessions, borderColor: '#0056b3', backgroundColor: '#0056b3', yAxisID: 'ySessions', tension: 0.3, borderDash: [5, 5] }
            ]
          },
          options: commonChartOptions
        });

        const tabsContainer = document.createElement('div');
        tabsContainer.className = 'tab-container';
        contentDiv.appendChild(tabsContainer);
        const sectionsContainer = document.createElement('div');
        contentDiv.appendChild(sectionsContainer);
        
        let isFirst = true;

        sortedYears.forEach(year => {
          const btn = document.createElement('button');
          btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
          btn.textContent = `📅 ${year}年度報表`;
          btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.year-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`year-${year}`).classList.add('active');
          };
          tabsContainer.appendChild(btn);

          const yearSection = document.createElement('div');
          yearSection.id = `year-${year}`;
          yearSection.className = `year-section ${isFirst ? 'active' : ''}`;

          const yearStats = data[year].stats;
          const yearCourses = data[year].courses;
          const terminals = Object.keys(yearStats).sort();

          const monthlyLabels = ['01月', '02月', '03月', '04月', '05月', '06月', '07月', '08月', '09月', '10月', '11月', '12月'];
          const monthlySessions = new Array(12).fill(0);
          const monthlyPeople = new Array(12).fill(0);

          const combinedStats = {};
          terminals.forEach(terminal => {
            for (const [month, shiftData] of Object.entries(yearStats[terminal])) {
              if (!combinedStats[month]) combinedStats[month] = { '早班': {sessions:0, people:0}, '中班': {sessions:0, people:0}, '夜班': {sessions:0, people:0} };
              const mIndex = parseInt(month.replace('月', '')) - 1;
              ['早班', '中班', '夜班'].forEach(shift => {
                const s = shiftData[shift]?.sessions || 0;
                const p = shiftData[shift]?.people || 0;
                combinedStats[month][shift].sessions += s;
                combinedStats[month][shift].people += p;
                if (mIndex >= 0 && mIndex < 12) {
                  monthlySessions[mIndex] += s;
                  monthlyPeople[mIndex] += p;
                }
              });
            }
          });

          const validMonths = Object.keys(combinedStats).length;
          const activeLabels = monthlyLabels.slice(0, validMonths > 0 ? 12 : 0);
          
          const monthChartCard = document.createElement('div');
          monthChartCard.className = 'card card-chart';
          monthChartCard.innerHTML = `
            <h2 class="title-chart">📊 ${year}年度 各月訓練執行趨勢</h2>
            <div class="chart-container"><canvas id="monthlyChart-${year}"></canvas></div>
          `;
          yearSection.appendChild(monthChartCard);

          setTimeout(() => {
            new Chart(document.getElementById(`monthlyChart-${year}`).getContext('2d'), {
              type: 'bar',
              data: {
                labels: activeLabels,
                datasets: [
                  { type: 'line', label: '總人數', data: monthlyPeople.slice(0, activeLabels.length), borderColor: '#28a745', backgroundColor: 'rgba(40,167,69,0.1)', yAxisID: 'yPeople', tension: 0.4, fill: true },
                  { type: 'bar', label: '總場次', data: monthlySessions.slice(0, activeLabels.length), backgroundColor: '#17a2b8', yAxisID: 'ySessions', borderRadius: 4 }
                ]
              },
              options: commonChartOptions
            });
          }, 100);

          if (Object.keys(combinedStats).length > 0) {
            yearSection.appendChild(createStatsTable(combinedStats, "📋 全區加總 (一航 ＋ 二航)", "title-total", "card-total"));
          }
          terminals.forEach(terminal => {
            yearSection.appendChild(createStatsTable(yearStats[terminal], `📍 ${terminal}`, "", "card-terminal"));
          });

          const combinedCourses = {};
          terminals.forEach(terminal => {
            if (yearCourses[terminal]) {
              for (const [rawCourseName, courseStats] of Object.entries(yearCourses[terminal])) {
                const cleanCourseName = normalizeCourseName(rawCourseName);
                if (!combinedCourses[cleanCourseName]) {
                  combinedCourses[cleanCourseName] = { sessions: 0, people: 0, details: [] };
                }
                combinedCourses[cleanCourseName].sessions += courseStats.sessions;
                combinedCourses[cleanCourseName].people += courseStats.people;
                if (courseStats.details) {
                  combinedCourses[cleanCourseName].details.push(...courseStats.details);
                }
              }
            }
          });

          const sortedCourses = Object.keys(combinedCourses).sort((a, b) => {
            if (combinedCourses[b].sessions !== combinedCourses[a].sessions) return combinedCourses[b].sessions - combinedCourses[a].sessions;
            return combinedCourses[b].people - combinedCourses[a].people;
          });

          if (sortedCourses.length > 0) {
            const courseCard = document.createElement('div');
            courseCard.className = 'card card-course';
            courseCard.innerHTML = `<h2 class="title-course">📚 訓練課程統計排行 (依 SOP 歸類) <span class="click-hint">👆 點擊表格任一列，可查看包含「確切日期」的詳細統計</span></h2>`;
            
            const courseTable = document.createElement('table');
            courseTable.className = 'course-table';
            courseTable.innerHTML = `<thead><tr><th width="10%">排名</th><th width="50%" style="text-align: left;">標準作業程序 (SOP) 名稱</th><th width="20%">年度累計場次</th><th width="20%">年度受訓總人數</th></tr></thead><tbody></tbody>`;
            
            const cTbody = courseTable.querySelector('tbody');
            sortedCourses.forEach((cName, index) => {
              const stats = combinedCourses[cName];
              const tr = document.createElement('tr');
              tr.className = 'clickable'; 
              tr.onclick = () => showCourseDetails(cName, stats.details);
              
              tr.innerHTML = `
                <td class="rank-num">${index + 1}</td>
                <td style="text-align: left; font-weight: 500; color: #0056b3;">${cName}</td>
                <td><span class="highlight-num">${stats.sessions}</span></td>
                <td><span class="highlight-num">${stats.people}</span></td>
              `;
              cTbody.appendChild(tr);
            });
            courseCard.appendChild(courseTable);
            yearSection.appendChild(courseCard);
          }
          sectionsContainer.appendChild(yearSection);
          isFirst = false;
        });
      })
      .catch(error => {
        document.getElementById('loading').innerHTML = '<div style="color:red;">❌ 讀取失敗，請確認 Apps Script API 權限或網址是否正確。</div>';
        console.error('Error:', error);
      });
  </script>
</body>
</html>
