<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>航廈教育訓練統計儀表板</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; color: #2c3e50; font-weight: bold; margin-bottom: 30px; }
    
    /* 頁籤設計 */
    .tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; justify-content: center; }
    .tab-btn { 
      padding: 10px 25px; cursor: pointer; border: 2px solid #0056b3; 
      background: #fff; color: #0056b3; border-radius: 8px; 
      font-size: 16px; font-weight: bold; transition: all 0.2s ease-in-out; 
    }
    .tab-btn:hover { background: #e6f0fa; transform: translateY(-2px); }
    .tab-btn.active { background: #0056b3; color: white; box-shadow: 0 4px 10px rgba(0,86,179,0.3); }
    
    .year-section { display: none; animation: fadeIn 0.4s ease-in-out; }
    .year-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-total { border-top: 5px solid #28a745; } /* 總計卡片加上綠邊 */
    .card-course { border-top: 5px solid #ffc107; } /* 課程卡片加上黃邊 */
    
    h2 { color: #0056b3; border-left: 4px solid #0056b3; padding-left: 10px; margin-top: 0; }
    .title-total { color: #28a745; border-color: #28a745; }
    .title-course { color: #d39e00; border-color: #ffc107; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; }
    th { background-color: #f8f9fa; color: #495057; font-weight: 600; }
    .total-col { background-color: #eef2f5; font-weight: bold; color: #0056b3; }
    
    /* 課程排行表特殊樣式 */
    .course-table th { background-color: #fff8e1; }
    .course-table tr:hover { background-color: #fdfbf5; }
    .rank-num { font-weight: bold; color: #666; }

    .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #666; }
  </style>
</head>
<body>
  <h1>航廈教育訓練場次與人數統計</h1>
  <div id="app">
    <div class="loading" id="loading">載入最新訓練數據中，請稍候...</div>
    <div id="content"></div>
  </div>

  <script>
    // ⚠️ 記得將下方換成您最新發佈的 GAS 網頁應用程式網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXg47GxjMju-NFoGnOp6CO5AyFZZ6PrqKMH2qBI3CncaFFoTISIPT3TBiQ-2h_CFIVJw/exec';

    // 🌟 新增：課程名稱統一歸類函數 🌟
    // 只要原始名稱包含特定「關鍵字」，就會被轉換成統一的標準名稱
    // 🌟 加強版：課程名稱統一歸類函數 🌟
    function normalizeCourseName(rawName) {
      if (!rawName) return "其他/未分類";
      let n = rawName.toString().trim();
      
      // 先轉為小寫並清除常見贅字，方便後續比對
      n = n.replace(/(教育訓練|宣導|教學|注意事項|規範|員工|測驗|敎育訓練|作業流程|處理流程|通報流程)$/g, "");
      n = n.replace(/敎育訓練/g, "");
      n = n.replace(/。/g, ""); // 去除句號
      
      // 1. 廁所與洗手間清潔 (綜合)
      if (n.includes("洗手間") || n.includes("公廁旅客接觸點") || n.includes("廁所旅客接觸點") || n.includes("智慧廁") || n.includes("廁所清洗") || n.includes("廁所設施設備")) return "洗手間與廁所設施清潔 (綜合)";
      
      // 2. 馬桶與小便斗
      if (n.includes("免治馬桶")) return "免治馬桶清潔與維護";
      if (n.includes("馬桶") && n.includes("小便斗")) return "馬桶與小便斗清洗維護";
      if (n.includes("馬桶")) return "馬桶清洗維護";
      if (n.includes("小便斗")) return "小便斗清洗維護";
      
      // 3. 抹布與擦拭法
      if (n.includes("抹布") || n.includes("八折法")) return "抹布分色與八折法使用";
      
      // 4. 清潔車與工具
      if (n.includes("推車") || n.includes("潔具車")) return "工作推車整潔維護與擺放";
      if (n.includes("耗材") || n.includes("垃圾袋") || n.includes("擦手紙") || n.includes("洗手乳")) return "廁所耗材更換與維護";
      
      // 5. 垃圾桶與垃圾場
      if (n.includes("垃圾桶") || n.includes("煙灰桶") || n.includes("菸灰桶")) return "垃圾桶與煙灰桶清潔 (含緊急處理)";
      if (n.includes("垃圾場") || n.includes("垃圾車") || n.includes("資源回收") || n.includes("廚餘") || n.includes("㕑餘")) return "垃圾場作業與資源回收分類";
      
      // 6. 突發狀況與污漬處理
      if (n.includes("嘔吐物") || n.includes("飲料") || n.includes("液體灑落")) return "嘔吐物與飲料打翻處理";
      if (n.includes("漏水") || n.includes("滴水") || n.includes("爆管")) return "漏水與滴水處理";
      if (n.includes("跌倒") || n.includes("滑倒")) return "防滑與跌倒/滑倒危害告知";
      
      // 7. 緊急按鈕與通報 (電扶梯/走道)
      if (n.includes("電扶梯") || n.includes("電走道") || n.includes("緊急鈴") || n.includes("緊急按鈕")) return "電扶梯與電走道緊急按鈕操作";
      if (n.includes("警報按鈕") || n.includes("緊急求救鈴") || n.includes("復歸") || n.includes("賦歸")) return "警報按鈕解除與復歸";
      if (n.includes("異常") || n.includes("通報") || n.includes("31999") || n.includes("OCC")) return "異常狀況與設施設備損壞通報";
      
      // 8. 旅客服務與遺失物
      if (n.includes("禮儀") || n.includes("敲門") || n.includes("旅客中英文")) return "服務禮儀與應對技巧";
      if (n.includes("遺失物") || n.includes("無主行李")) return "拾獲遺失物與無主行李處理";
      if (n.includes("可疑")) return "發現可疑人事物處理";
      
      // 9. 公區與地面清潔
      if (n.includes("公區清消") || n.includes("候機室") || n.includes("大廳")) return "公區與候機室清消作業";
      if (n.includes("地面清洗") || n.includes("洗地") || n.includes("地面污垢")) return "地面清洗作業與安全防護";
      if (n.includes("鏡面") || n.includes("洗手台") || n.includes("洗手檯") || n.includes("水漬")) return "洗手台與鏡面水漬清理";
      
      // 10. KPI 與防護
      if (n.includes("KPI") || n.includes("6+1")) return "6+1項 KPI 清消作業";
      if (n.includes("防護") || n.includes("隔離衣")) return "安全防護裝備穿脫";
      if (n.includes("管制證") || n.includes("通行證") || n.includes("門禁") || n.includes("管制門")) return "門禁管制與通行證使用注意事項";
      if (n.includes("噴霧機") || n.includes("吸塵器") || n.includes("打蠟機") || n.includes("洗地機")) return "電動清潔機具操作 (噴霧/吸塵/打蠟)";
      
      // 11. 工安與防災
      if (n.includes("火災") || n.includes("火警") || n.includes("滅火器") || n.includes("行動電源")) return "火警應變與滅火器使用";
      if (n.includes("地震")) return "地震緊急應變";
      if (n.includes("墜落") || n.includes("滾落")) return "墜落與滾落危害告知";
      if (n.includes("AED") || n.includes("CPR")) return "CPR 及 AED 訓練";

      return n.trim();
    }

    // 負責產生月統計表格 HTML 的函數
    function createStatsTable(monthsData, title, titleClass = "", cardClass = "") {
      const card = document.createElement('div');
      card.className = `card ${cardClass}`;
      card.innerHTML = `<h2 class="${titleClass}">${title}</h2>`;
      
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th rowspan="2">月份</th>
            <th colspan="2">早班</th>
            <th colspan="2">中班</th>
            <th colspan="2">夜班</th>
            <th colspan="2" class="total-col">月總計</th>
          </tr>
          <tr>
            <th>場次</th><th>人數</th>
            <th>場次</th><th>人數</th>
            <th>場次</th><th>人數</th>
            <th class="total-col">總場次</th><th class="total-col">總人數</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      
      const tbody = table.querySelector('tbody');
      const sortedMonths = Object.keys(monthsData).sort();
      let yearTotalSessions = 0, yearTotalPeople = 0;

      sortedMonths.forEach(month => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${month}</td>`;
        let monthSessions = 0, monthPeople = 0;
        
        ['早班', '中班', '夜班'].forEach(shift => {
          const stats = monthsData[month][shift] || { sessions: 0, people: 0 };
          tr.innerHTML += `<td>${stats.sessions}</td><td>${stats.people}</td>`;
          monthSessions += stats.sessions;
          monthPeople += stats.people;
        });
        
        tr.innerHTML += `<td class="total-col">${monthSessions}</td><td class="total-col">${monthPeople}</td>`;
        tbody.appendChild(tr);
        yearTotalSessions += monthSessions;
        yearTotalPeople += monthPeople;
      });
      
      const footerTr = document.createElement('tr');
      footerTr.innerHTML = `
        <td style="font-weight: bold; background: #eef2f5;">年度累計</td>
        <td colspan="6" style="background: #eef2f5;"></td>
        <td class="total-col" style="font-size:1.1em;">${yearTotalSessions}</td>
        <td class="total-col" style="font-size:1.1em;">${yearTotalPeople}</td>
      `;
      tbody.appendChild(footerTr);
      card.appendChild(table);
      return card;
    }

    fetch(GAS_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        const contentDiv = document.getElementById('content');
        
        const tabsContainer = document.createElement('div');
        tabsContainer.className = 'tab-container';
        contentDiv.appendChild(tabsContainer);

        const sectionsContainer = document.createElement('div');
        contentDiv.appendChild(sectionsContainer);

        const sortedYears = Object.keys(data).sort();
        let isFirst = true;

        sortedYears.forEach(year => {
          const btn = document.createElement('button');
          btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
          btn.textContent = `${year}年度`;
          btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.year-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`year-${year}`).classList.add('active');
          };
          tabsContainer.appendChild(btn);

          const yearSection = document.createElement('div');
          yearSection.id = `year-${year}`;
          yearSection.className = `year-section ${isFirst ? 'active' : ''}`;

          const yearStats = data[year].stats;
          const yearCourses = data[year].courses;
          const terminals = Object.keys(yearStats).sort();

          // 1. 全區加總月報表
          const combinedStats = {};
          terminals.forEach(terminal => {
            for (const [month, shiftData] of Object.entries(yearStats[terminal])) {
              if (!combinedStats[month]) {
                combinedStats[month] = { '早班': {sessions:0, people:0}, '中班': {sessions:0, people:0}, '夜班': {sessions:0, people:0} };
              }
              ['早班', '中班', '夜班'].forEach(shift => {
                combinedStats[month][shift].sessions += (shiftData[shift]?.sessions || 0);
                combinedStats[month][shift].people += (shiftData[shift]?.people || 0);
              });
            }
          });
          if (Object.keys(combinedStats).length > 0) {
            yearSection.appendChild(createStatsTable(combinedStats, "全區加總 (一航 ＋ 二航)", "title-total", "card-total"));
          }

          // 2. 各航廈月報表
          terminals.forEach(terminal => {
            yearSection.appendChild(createStatsTable(yearStats[terminal], terminal));
          });

          // 3. 🌟 課程排名 (導入歸類邏輯) 🌟
          const combinedCourses = {};
          terminals.forEach(terminal => {
            if (yearCourses[terminal]) {
              for (const [rawCourseName, courseStats] of Object.entries(yearCourses[terminal])) {
                // 將原始名稱丟入我們寫好的函數進行清理與歸類
                const cleanCourseName = normalizeCourseName(rawCourseName);
                
                if (!combinedCourses[cleanCourseName]) {
                  combinedCourses[cleanCourseName] = { sessions: 0, people: 0 };
                }
                // 將場次與人數合併到「清理後的名稱」底下
                combinedCourses[cleanCourseName].sessions += courseStats.sessions;
                combinedCourses[cleanCourseName].people += courseStats.people;
              }
            }
          });

          const sortedCourses = Object.keys(combinedCourses).sort((a, b) => {
            if (combinedCourses[b].sessions !== combinedCourses[a].sessions) {
              return combinedCourses[b].sessions - combinedCourses[a].sessions;
            }
            return combinedCourses[b].people - combinedCourses[a].people;
          });

          if (sortedCourses.length > 0) {
            const courseCard = document.createElement('div');
            courseCard.className = 'card card-course';
            courseCard.innerHTML = `<h2 class="title-course">📚 訓練課程統計排行 (全區歸類後)</h2>`;
            
            const courseTable = document.createElement('table');
            courseTable.className = 'course-table';
            courseTable.innerHTML = `
              <thead>
                <tr>
                  <th width="10%">排名</th>
                  <th width="50%" style="text-align: left;">訓練課程名稱</th>
                  <th width="20%">累計場次</th>
                  <th width="20%">受訓總人數</th>
                </tr>
              </thead>
              <tbody></tbody>
            `;
            
            const cTbody = courseTable.querySelector('tbody');
            sortedCourses.forEach((cName, index) => {
              const stats = combinedCourses[cName];
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td class="rank-num">${index + 1}</td>
                <td style="text-align: left; font-weight: 500;">${cName}</td>
                <td>${stats.sessions}</td>
                <td>${stats.people}</td>
              `;
              cTbody.appendChild(tr);
            });
            courseCard.appendChild(courseTable);
            yearSection.appendChild(courseCard);
          }

          sectionsContainer.appendChild(yearSection);
          isFirst = false;
        });
      })
      .catch(error => {
        document.getElementById('loading').textContent = '讀取失敗，請確認 Apps Script API 權限或網址是否正確。';
        console.error('Error:', error);
      });
  </script>
</body>
</html>
